AWSTemplateFormatVersion: "2010-09-09"
Description: "S3 + DynamoDB backend for Four-cast Terraform remote state"

Resources:

  TerraformStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub "four-cast-tfstate-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90

  TerraformLockTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: four-cast-tfstate-lock
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: LockID
          AttributeType: S
      KeySchema:
        - AttributeName: LockID
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

Outputs:
  StateBucketName:
    Description: "S3 bucket name for Terraform remote state"
    Value: !Ref TerraformStateBucket
    Export:
      Name: FourCast-TFStateBucket
  LockTableName:
    Description: "DynamoDB table name for Terraform state locking"
    Value: !Ref TerraformLockTable
    Export:
      Name: FourCast-TFLockTable
