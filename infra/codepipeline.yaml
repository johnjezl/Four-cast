AWSTemplateFormatVersion: "2010-09-09"
Description: "Four-cast AWS CodePipeline CI/CD - Track B (johnjezl/Four-cast)"

Parameters:
  GitHubOwner:
    Type: String
    Default: johnjezl
  GitHubRepo:
    Type: String
    Default: Four-cast
  GitHubBranch:
    Type: String
    Default: main
  GitHubConnectionArn:
    Type: String
    Description: "ARN of CodeStar Connections GitHub App (created once manually)"
  Environment:
    Type: String
    Default: dev
    AllowedValues: [ dev, staging, prod ]
  ECSCluster:
    Type: String
    Default: smarthome-dev-cluster

Resources:

  # S3 Artifact Bucket
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub "four-cast-codepipeline-artifacts-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # IAM Role: CodeBuild
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: four-cast-codebuild-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ "logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents" ]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/four-cast-*"
        - PolicyName: S3ArtifactAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ "s3:GetObject", "s3:PutObject", "s3:GetObjectVersion", "s3:GetBucketAcl", "s3:GetBucketLocation" ]
                Resource: [ !GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*" ]
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:DescribeRepositories
                Resource: !Sub "arn:aws:ecr:*:${AWS::AccountId}:repository/smarthome-*"
        - PolicyName: STSCallerIdentity
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: "*"

  # IAM Role: CodePipeline
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: four-cast-codepipeline-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelinePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ "s3:GetObject", "s3:PutObject", "s3:GetBucketVersioning", "s3:GetObjectVersion", "s3:ListBucket" ]
                Resource: [ !GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*" ]
              - Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !Ref GitHubConnectionArn
              - Effect: Allow
                Action: [ "codebuild:BatchGetBuilds", "codebuild:StartBuild", "codebuild:BatchGetBuildBatches", "codebuild:StartBuildBatch" ]
                Resource: !GetAtt CodeBuildProject.Arn
              - Effect: Allow
                Action: [ "ecs:DescribeServices", "ecs:DescribeTaskDefinition", "ecs:DescribeTasks", "ecs:ListTasks", "ecs:RegisterTaskDefinition", "ecs:TagResource", "ecs:UpdateService", "iam:PassRole" ]
                Resource: "*"

  # CodeBuild Project
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: four-cast-build
      Description: "Builds and pushes Docker images for all five Four-cast microservices"
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Value: !Ref Environment
          - Name: ECS_CLUSTER
            Value: !Ref ECSCluster
          - Name: AWS_REGION
            Value: !Ref AWS::Region
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: /aws/codebuild/four-cast-build
      TimeoutInMinutes: 30
      Cache:
        Type: LOCAL
        Modes: [ LOCAL_DOCKER_LAYER_CACHE, LOCAL_SOURCE_CACHE ]

  # CodePipeline
  FourCastPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: four-cast-cicd
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:

        # Stage 1: Source
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Sub "${GitHubOwner}/${GitHubRepo}"
                BranchName: !Ref GitHubBranch
                OutputArtifactFormat: CODE_ZIP
                DetectChanges: "true"
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

        # Stage 2: Build
        - Name: Build
          Actions:
            - Name: BuildDockerImages
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref CodeBuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1

        # Stage 3: Deploy (parallel ECS deployments)
        - Name: Deploy
          Actions:
            - Name: Deploy-device-service
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ECS
                Version: "1"
              Configuration:
                ClusterName: !Ref ECSCluster
                ServiceName: device-service
                FileName: imagedefinitions.json
                DeploymentTimeout: "15"
              InputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1
            - Name: Deploy-automation-service
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ECS
                Version: "1"
              Configuration:
                ClusterName: !Ref ECSCluster
                ServiceName: automation-service
                FileName: imagedefinitions.json
                DeploymentTimeout: "15"
              InputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1
            - Name: Deploy-user-service
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ECS
                Version: "1"
              Configuration:
                ClusterName: !Ref ECSCluster
                ServiceName: user-service
                FileName: imagedefinitions.json
                DeploymentTimeout: "15"
              InputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1
            - Name: Deploy-analytics-service
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ECS
                Version: "1"
              Configuration:
                ClusterName: !Ref ECSCluster
                ServiceName: analytics-service
                FileName: imagedefinitions.json
                DeploymentTimeout: "15"
              InputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1

Outputs:
  PipelineUrl:
    Description: "AWS Console URL for the CodePipeline"
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/four-cast-cicd/view"
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
    Export:
      Name: FourCast-ArtifactBucket
  CodeBuildProjectName:
    Value: !Ref CodeBuildProject
    Export:
      Name: FourCast-CodeBuildProject
  PipelineName:
    Value: !Ref FourCastPipeline
    Export:
      Name: FourCast-Pipeline
