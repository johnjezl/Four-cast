# .github/workflows/aws-cicd.yml
# Four-cast AWS CI/CD Pipeline - Track A (GitHub Actions)
# Jobs: validate (terraform), build (docker+ECR), deploy (ECS)

name: "Four-cast AWS CI/CD"

on:
  push:
    branches: [ main ]
    paths:
      - "aws/**"
      - "shared/**"
      - ".github/workflows/aws-cicd.yml"
      - "buildspec.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "aws/**"
      - "shared/**"

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  ECS_CLUSTER: smarthome-dev-cluster

jobs:

  # ============================================================
  # JOB 1: Terraform Format Check + Validate
  # Uses local backend so it works before S3 bucket is created.
  # ============================================================
  validate:
    name: "Terraform Validate"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"

      - name: Terraform Init (local backend for validation)
        working-directory: aws/terraform
        run: terraform init -backend=false

      - name: Terraform Format Check
        working-directory: aws/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: aws/terraform
        run: terraform validate

  # ============================================================
  # JOB 2: Build Docker Images and Push to ECR
  # Creates ECR repos if they don't exist, then builds & pushes.
  # Only runs on push to main (not PRs).
  # ============================================================
  build:
    name: "Build & Push to ECR"
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repositories exist
        run: |
          SERVICES=(device-service automation-service user-service analytics-service tuya-bridge)
          for SERVICE in "${SERVICES[@]}"; do
            REPO_NAME="smarthome-${ENVIRONMENT}-${SERVICE}"
            echo "Ensuring ECR repo exists: ${REPO_NAME}"
            aws ecr describe-repositories --repository-names "${REPO_NAME}" --region ${{ env.AWS_REGION }} 2>/dev/null \
              || aws ecr create-repository \
                   --repository-name "${REPO_NAME}" \
                   --region ${{ env.AWS_REGION }} \
                   --image-scanning-configuration scanOnPush=true \
                   --encryption-configuration encryptionType=AES256
            echo "  -> Ready: ${REPO_NAME}"
          done

      - name: Build and push all five services
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          SERVICES=(device-service automation-service user-service analytics-service tuya-bridge)
          for SERVICE in "${SERVICES[@]}"; do
            REPO="${ECR_REGISTRY}/smarthome-${ENVIRONMENT}-${SERVICE}"
            echo "==> Building ${SERVICE} (tag: ${IMAGE_TAG})"
            docker build -t "${REPO}:${IMAGE_TAG}" -t "${REPO}:latest" -f "aws/services/${SERVICE}/Dockerfile" .
            docker push "${REPO}:${IMAGE_TAG}"
            docker push "${REPO}:latest"
            echo "Pushed: ${REPO}:${IMAGE_TAG}"
          done
          echo "All images pushed successfully."

  # ============================================================
  # JOB 3: Deploy to ECS Fargate
  # Gracefully skips services that don't exist yet
  # (ECS services are created by terraform apply, not this pipeline).
  # ============================================================
  deploy:
    name: "Deploy to ECS Fargate"
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy services to ECS (skips if not yet provisioned)
        run: |
          SERVICES=(device-service automation-service user-service analytics-service tuya-bridge)
          DEPLOYED=0
          SKIPPED=0
          for SERVICE in "${SERVICES[@]}"; do
            ECS_SERVICE="smarthome-${ENVIRONMENT}-${SERVICE}"
            echo "==> Redeploying ${ECS_SERVICE}"
            RESULT=$(aws ecs update-service \
              --cluster "${{ env.ECS_CLUSTER }}" \
              --service "${ECS_SERVICE}" \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }} 2>&1) && {
              echo "  -> Deployment triggered for ${ECS_SERVICE}"
              DEPLOYED=$((DEPLOYED+1))
            } || {
              echo "  -> SKIPPED: ${ECS_SERVICE} not found (run terraform apply to provision)"
              SKIPPED=$((SKIPPED+1))
            }
          done
          echo ""
          echo "Deploy summary: ${DEPLOYED} deployed, ${SKIPPED} skipped (not yet provisioned)"
          if [ "$DEPLOYED" -eq 0 ] && [ "$SKIPPED" -gt 0 ]; then
            echo "NOTE: No ECS services found. Images are in ECR ready for when terraform apply creates the services."
          fi

      - name: Wait for deployed services to stabilize
        run: |
          SERVICES=(device-service automation-service user-service analytics-service tuya-bridge)
          for SERVICE in "${SERVICES[@]}"; do
            ECS_SERVICE="smarthome-${ENVIRONMENT}-${SERVICE}"
            # Only wait if the service actually exists
            if aws ecs describe-services \
                 --cluster "${{ env.ECS_CLUSTER }}" \
                 --services "${ECS_SERVICE}" \
                 --region ${{ env.AWS_REGION }} \
                 --query "services[?status=='ACTIVE']" \
                 --output text 2>/dev/null | grep -q "${ECS_SERVICE}"; then
              echo "Waiting for ${ECS_SERVICE} to stabilize..."
              aws ecs wait services-stable \
                --cluster "${{ env.ECS_CLUSTER }}" \
                --services "${ECS_SERVICE}" \
                --region ${{ env.AWS_REGION }} \
                && echo "  -> Stable: ${ECS_SERVICE}" \
                || echo "  -> Timeout waiting for ${ECS_SERVICE} (continuing)"
            else
              echo "Skipping wait for ${ECS_SERVICE} (not provisioned yet)"
            fi
          done
          echo "Deployment step complete."
