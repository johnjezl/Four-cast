# .github/workflows/aws-cicd.yml
# Four-cast AWS CI/CD Pipeline - Track A (GitHub Actions)
# Jobs: validate (terraform), build (docker+ECR), deploy (ECS)

name: "Four-cast AWS CI/CD"

on:
  push:
    branches: [ main ]
    paths:
      - "aws/**"
      - "shared/**"
      - ".github/workflows/aws-cicd.yml"
      - "buildspec.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "aws/**"
      - "shared/**"

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  ECS_CLUSTER: smarthome-dev-cluster

jobs:

  # ============================================================
  # JOB 1: Terraform Format Check + Validate
  # ============================================================
  validate:
    name: "Terraform Validate"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"

      - name: Terraform Init
        working-directory: aws/terraform
        run: |
          terraform init \
            -backend-config="bucket=four-cast-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" \
            -backend-config="key=aws/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=four-cast-tfstate-lock"

      - name: Terraform Format Check
        working-directory: aws/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: aws/terraform
        run: terraform validate

  # ============================================================
  # JOB 2: Build Docker Images and Push to ECR
  # Only runs on push to main (not PRs).
  # ============================================================
  build:
    name: "Build & Push to ECR"
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repositories exist
        run: |
          SERVICES=(device-service automation-service user-service analytics-service tuya-bridge)
          for SERVICE in "${SERVICES[@]}"; do
            REPO_NAME="smarthome-${ENVIRONMENT}-${SERVICE}"
            echo "Ensuring ECR repo exists: ${REPO_NAME}"
            aws ecr describe-repositories --repository-names "${REPO_NAME}" --region ${{ env.AWS_REGION }} 2>/dev/null || \
              aws ecr create-repository \
                --repository-name "${REPO_NAME}" \
                --region ${{ env.AWS_REGION }} \
                --image-scanning-configuration scanOnPush=true \
                --encryption-configuration encryptionType=AES256
            echo "  -> OK: ${REPO_NAME}"
          done

      - name: Build and push all five services
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          SERVICES=(device-service automation-service user-service analytics-service tuya-bridge)
          for SERVICE in "${SERVICES[@]}"; do
            REPO="${ECR_REGISTRY}/smarthome-${ENVIRONMENT}-${SERVICE}"
            echo "==> Building ${SERVICE} (tag: ${IMAGE_TAG})"
            docker build -t "${REPO}:${IMAGE_TAG}" -t "${REPO}:latest" -f "aws/services/${SERVICE}/Dockerfile" .
            docker push "${REPO}:${IMAGE_TAG}"
            docker push "${REPO}:latest"
            echo "Pushed: ${REPO}:${IMAGE_TAG}"
          done
          echo "All images pushed successfully."

  # ============================================================
  # JOB 3: Deploy to ECS Fargate
  # ============================================================
  deploy:
    name: "Deploy to ECS Fargate"
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy all services to ECS
        run: |
          SERVICES=(device-service automation-service user-service analytics-service tuya-bridge)
          for SERVICE in "${SERVICES[@]}"; do
            ECS_SERVICE="smarthome-${ENVIRONMENT}-${SERVICE}"
            echo "==> Deploying ${ECS_SERVICE} to cluster ${ECS_CLUSTER}"
            aws ecs update-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service "${ECS_SERVICE}" \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }} || echo "WARNING: service ${ECS_SERVICE} not found, skipping."
          done

      - name: Wait for services to stabilize
        run: |
          SERVICES=(device-service automation-service user-service analytics-service tuya-bridge)
          for SERVICE in "${SERVICES[@]}"; do
            ECS_SERVICE="smarthome-${ENVIRONMENT}-${SERVICE}"
            echo "Waiting for ${ECS_SERVICE} to stabilize..."
            aws ecs wait services-stable \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services "${ECS_SERVICE}" \
              --region ${{ env.AWS_REGION }} || echo "WARNING: ${ECS_SERVICE} wait skipped (service may not exist yet)."
          done
          echo "Deployment complete."
